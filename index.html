<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmador de Diplomas</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <header class="cabecera">
    <h1>Firmador de Diplomas</h1>
    <p>Suba el PDF, ubique la firma una sola vez y aplíquela a todas las páginas.</p>
  </header>

  <main class="contenido">
    <section class="paneles">
      <div class="panel">
        <h2>1. Subir el PDF</h2>
        <input type="file" id="input-pdf" accept="application/pdf">
      </div>
      <div class="panel">
        <h2>2. Subir las firmas</h2>
        <div class="fila-firma">
          <label for="input-firma-1">Firma 1</label>
          <input type="file" id="input-firma-1" accept="image/png,image/jpeg,image/webp">
          <span class="estado-firma" id="estado-firma-1">No cargada</span>
        </div>
        <div class="fila-firma">
          <label for="input-firma-2">Firma 2</label>
          <input type="file" id="input-firma-2" accept="image/png,image/jpeg,image/webp">
          <span class="estado-firma" id="estado-firma-2">No cargada</span>
        </div>
      </div>
    </section>

    <section id="lienzo-panel" class="oculto">
      <h2>3. Ubique las firmas sobre la hoja</h2>
      <div id="visor">
        <canvas id="canvas-pagina"></canvas>
        <div id="capas-firmas"></div>
      </div>
      <div id="controles" class="oculto">
        <div class="grupo-control">
          <h3>Firma 1</h3>
          <label for="control-tamano-1">Tamaño</label>
          <input type="range" id="control-tamano-1" min="5" max="80" value="15">
          <label for="control-rotacion-1">Rotación (°)</label>
          <input type="range" id="control-rotacion-1" min="-180" max="180" value="0">
        </div>
        <div class="grupo-control">
          <h3>Firma 2</h3>
          <label for="control-tamano-2">Tamaño</label>
          <input type="range" id="control-tamano-2" min="5" max="80" value="15">
          <label for="control-rotacion-2">Rotación (°)</label>
          <input type="range" id="control-rotacion-2" min="-180" max="180" value="0">
        </div>
        <button id="btn-aplicar">Aplicar a todas las páginas</button>
      </div>
    </section>

    <section id="progreso-panel" class="oculto">
      <div class="barra-progreso">
        <div id="relleno-progreso"></div>
      </div>
      <p id="texto-progreso"></p>
    </section>
  </main>

  <footer class="pie">
    <p>Los archivos se procesan íntegramente en su equipo. Nada se sube a internet.</p>
  </footer>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
